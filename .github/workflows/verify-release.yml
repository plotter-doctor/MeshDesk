name: Verify published Windows TLS
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        default: v0.3.0
permissions:
  contents: read
jobs:
  published-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.7
      - name: Download and verify published bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$env:RELEASE_TAG" --pattern 'MeshDesk-*-windows-x86_64.zip*' --dir public-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Get-ChildItem public-release/*.zip | Select-Object -First 1
          $expected = (Get-Content ($archive.FullName + '.sha256')).Split(' ')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne $expected) { throw 'Checksum mismatch' }
          Expand-Archive $archive.FullName public-release/unpacked
      - run: python tools/probe_windows_tls.py public-release/unpacked/MeshDesk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-windows-tls
          path: artifacts/windows/
