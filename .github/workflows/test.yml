name: Native client compatibility
on: [pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: windows-2025, python: '3.12'}
    env:
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Material
      MESHDESK_ARTIFACTS: artifacts/screenshots
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox x11-utils libegl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 fonts-noto-color-emoji
      - if: runner.os == 'Linux'
        run: python -m pip install -c requirements-linux.lock -e '.[desktop,test]' wheel
      - if: runner.os != 'Linux'
        run: python -m pip install -e '.[desktop,test]' wheel
      - run: python tools/audit_compatibility.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --cov --cov-report=xml:artifacts/coverage.xml --cov-report=json:artifacts/coverage.json --cov-report=html --junitxml=artifacts/results.xml
      - if: runner.os == 'Linux'
        run: python tools/check_coverage.py artifacts/coverage.json
      - if: runner.os != 'Linux'
        run: python -m pytest -q --junitxml=artifacts/results.xml
      - run: python -m pip wheel --no-deps . -w dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/
            dist/meshdesk-*.whl
